[project]
name = "mcp-gateway"
version = "0.1.0"
description = "HTTP JSON-RPC reverse proxy that authorizes MCP tool calls by the caller's JWT role"
readme = "README.md"
authors = [
    { name = "Harsh Chauhan", email = "75563731+harshrc1357@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "pyjwt>=2.10.1",
    "starlette>=0.48.0",
    "uvicorn>=0.31.1",
]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"
mock-mcp-server = "mcp_gateway.mock_server:main"
issue-token = "mcp_gateway.token_cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "pytest>=9.2.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: in-process HTTP calls to the gateway with a recording downstream",
    "e2e: real gateway and real SDK MCP server processes, driven by the official MCP client",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.coverage.run]
source = ["mcp_gateway"]
# The mock server is the stand-in downstream for the e2e tests, not gateway code.
omit = ["*/mcp_gateway/mock_server.py"]
# The e2e tests run the gateway and the mock server as subprocesses; measure them too.
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
