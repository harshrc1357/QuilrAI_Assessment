[project]
name = "pii-guardrail"
version = "0.1.0"
description = "LLM gateway that streams provider responses and redacts PII in real time"
readme = "README.md"
authors = [
    { name = "Harsh Chauhan", email = "75563731+harshrc1357@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "regex>=2026.11.7",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pii-guardrail = "pii_guardrail.__main__:main"
mock-llm-provider = "pii_guardrail.mock_provider:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: the redactor alone, no I/O",
    "integration: in-process HTTP calls to the gateway with a mock provider",
    "e2e: real gateway and real mock provider processes",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.coverage.run]
source = ["pii_guardrail"]
omit = ["*/pii_guardrail/mock_provider.py"]
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "bandit[toml]>=1.9.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
